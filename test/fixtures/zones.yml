    Sur la base des données en notre possession, il apparaît que l'entreprise présente des caractéristiques similaires à des sociétés ayant fait défaut dans les 18 mois suivants.

    Le risque de défaillance de l'entreprise sous 18 mois apparaît comme **%{criticite}**.

    Les données actualisées jusqu'au **%{data_date}** sont mobilisées pour cette prédiction.

